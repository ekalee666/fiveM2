<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>INFERNO HUD</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div id="hud" class="hud hidden">

    <!-- Fire canvas background -->
    <canvas id="fire-canvas"></canvas>

    <!-- ── LEFT CLUSTER ── -->
    <div class="cluster left-cluster">

        <!-- Fuel -->
        <div class="indicator-pill" id="pill-fuel">
            <svg class="pill-icon" viewBox="0 0 24 24"><path d="M13.5 0.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5 0.67z"/></svg>
            <div class="pill-bar-wrap">
                <div class="pill-bar-track">
                    <div id="fuel-bar" class="pill-bar fuel-color"></div>
                </div>
                <span id="fuel-val" class="pill-val">100%</span>
            </div>
        </div>

        <!-- Engine Health -->
        <div class="indicator-pill" id="pill-health">
            <svg class="pill-icon" viewBox="0 0 24 24"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg>
            <div class="pill-bar-wrap">
                <div class="pill-bar-track">
                    <div id="health-bar" class="pill-bar health-color"></div>
                </div>
                <span id="health-val" class="pill-val">100%</span>
            </div>
        </div>

        <!-- Engine status -->
        <div class="indicator-pill">
            <svg class="pill-icon" viewBox="0 0 24 24"><path d="M7 4v2H4v3H2V4h5zm15 5h-2V6h-3V4h5v5zM7 20H2v-5h2v3h3v2zm10 0v-2h3v-3h2v5h-5zM17 8h-2V6h-2v2H9v7h2v2h2v-2h2v-2h2V8z"/></svg>
            <span id="engine-lbl" class="pill-text off">OFF</span>
            <span class="pill-dot" id="engine-dot"></span>
        </div>

        <!-- Seatbelt -->
        <div class="indicator-pill" id="pill-seatbelt">
            <svg class="pill-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            <span id="seatbelt-lbl" class="pill-text on">BELT ON</span>
            <span class="pill-dot" id="seatbelt-dot"></span>
        </div>

    </div>

    <!-- ── CENTER SPEEDO ── -->
    <div class="center-speedo">

        <!-- Top: indicators row -->
        <div class="top-indicators">
            <div id="ind-left"  class="ind-arrow left">◀</div>
            <div id="ind-lights" class="ind-icon">💡</div>
            <div id="ind-engine-warn" class="ind-icon warn">⚠</div>
            <div id="ind-right" class="ind-arrow right">▶</div>
        </div>

        <!-- Main dial (canvas) -->
        <div class="dial-wrap">
            <canvas id="dial-canvas" width="200" height="200"></canvas>
            <!-- Speed overlay -->
            <div class="dial-overlay">
                <div class="speed-num-wrap">
                    <span id="speed-num" class="speed-num">0</span>
                    <span id="speed-unit" class="speed-unit">MPH</span>
                </div>
                <div class="gear-badge" id="gear-badge">N</div>
            </div>
        </div>

        <!-- Bottom: RPM bar + ODO -->
        <div class="bottom-row">
            <span class="rpm-label">RPM</span>
            <div class="rpm-track">
                <div id="rpm-bar" class="rpm-fill"></div>
                <div id="rpm-redline" class="rpm-redline"></div>
            </div>
            <span id="odo-val" class="odo-val">0.0 mi</span>
        </div>

    </div>

    <!-- ── RIGHT CLUSTER ── -->
    <div class="cluster right-cluster">

        <!-- Headlights -->
        <div class="indicator-pill">
            <svg class="pill-icon" viewBox="0 0 256 256"><path d="M144,64V192a16,16,0,0,1-16,16H88A80,80,0,0,1,8,127.39C8.33,83.62,44.62,48,88.9,48H128A16,16,0,0,1,144,64Zm96,104H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16ZM168,88h72a8,8,0,0,0,0-16H168a8,8,0,0,0,0,16Zm72,16H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Z"/></svg>
            <span id="lights-lbl" class="pill-text off">OFF</span>
            <span class="pill-dot" id="lights-dot"></span>
        </div>

        <!-- Left indicator -->
        <div class="indicator-pill" id="pill-ind-left">
            <span style="font-size:14px">◀◀</span>
            <span id="left-lbl" class="pill-text off">LEFT</span>
            <span class="pill-dot" id="left-dot"></span>
        </div>

        <!-- Right indicator -->
        <div class="indicator-pill" id="pill-ind-right">
            <span style="font-size:14px">▶▶</span>
            <span id="right-lbl" class="pill-text off">RIGHT</span>
            <span class="pill-dot" id="right-dot"></span>
        </div>

        <!-- Speed mode badge -->
        <div class="indicator-pill" id="pill-mode">
            <svg class="pill-icon" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/></svg>
            <span id="mode-lbl" class="pill-text on">MPH</span>
        </div>

    </div>

</div>

<!-- Controls: scale/drag -->
<div id="hud-controls" class="hud-controls">
    <button id="btn-minus" class="ctrl-btn">−</button>
    <button id="btn-reset" class="ctrl-btn">↺</button>
    <button id="btn-plus"  class="ctrl-btn">+</button>
</div>

<script src="scripts/app.js"></script>
</body>
</html>
